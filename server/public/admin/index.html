<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Glen Monks — CMS Admin</title>
<link rel="icon" href="/assets/images/logo-icon.png" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<!-- Login -->
<div class="login" id="login">
  <form class="login__card" id="loginForm">
    <div class="login__mark">GM</div>
    <h1>Glen Monks <span>CMS</span></h1>
    <p class="login__sub">Sign in to edit the website</p>
    <label>
      <span>Username</span>
      <input type="text" name="username" autocomplete="username" required autofocus />
    </label>
    <label>
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <p class="form-error" id="loginError"></p>
    <button class="btn btn--gold" type="submit">Sign in</button>
    <p class="login__hint">Default: admin / glenmonks2026 — change it after signing in.</p>
  </form>
</div>

<!-- App shell -->
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__mark">GM</span>
      <span>Glen Monks<br><small>Content Studio</small></span>
    </div>
    <nav id="sideNav" class="side-nav"></nav>
    <div class="sidebar__foot">
      <a href="/" target="_blank" rel="noopener">View website ↗</a>
      <button id="logoutBtn" type="button">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="viewTitle">Dashboard</h2>
      <div class="topbar__right" id="topbarRight"></div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast" hidden></div>

<!-- Modal -->
<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__box">
    <header><h3 id="modalTitle"></h3><button class="modal__close" data-close type="button">×</button></header>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
